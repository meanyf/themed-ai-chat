<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <title>Кулинарный помощник</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js?v=2"></script>
</head>
<body>
    <main>
        <h1>Кулинарный помощник</h1>

        <div id="startup">
            <p id="startup-status" role="status">Загрузка истории…</p>
            <button id="retry-history" type="button" hidden>Повторить загрузку</button>
        </div>

        <section id="login-screen" hidden aria-labelledby="login-title">
            <h2 id="login-title">Вход в чат</h2>
            <form id="login-form" method="post">
                <label for="access-key">Ключ доступа</label>
                <input id="access-key" type="password" required minlength="8" maxlength="255"
                       autocomplete="current-password" aria-describedby="key-hint login-error">
                <button type="button" id="toggle-key" aria-controls="access-key">Показать</button>
                <p id="login-error" role="alert"></p>
                <p id="key-hint">От 8 до 255 символов: латинские буквы, цифры, дефис и подчёркивание.</p>
                <button id="login-submit" type="submit" disabled>Войти</button>
            </form>
        </section>

        <section id="chat-screen" aria-labelledby="chat-title" hidden>
            <header>
                <h2 id="chat-title">Чат</h2>
                <span id="logout-error" role="alert"></span>
                <button id="logout" type="button">Выйти</button>
            </header>
            <section id="empty-history" aria-labelledby="empty-title" hidden>
                <h3 id="empty-title">Что приготовим?</h3>
                <button type="button">Что приготовить из нута за 20 минут?</button>
                <button type="button">Чем заменить яйца в оладьях?</button>
            </section>
            <ol id="messages" aria-label="История переписки"></ol>
            <form id="message-form" method="post">
                <label for="message-text">Ваш вопрос</label>
                <textarea id="message-text" aria-describedby="message-count" rows="3" required></textarea>
                <span id="message-count">0/500</span>
                <span id="send-status" role="status"></span>
                <button id="send-button" type="submit" disabled>Отправить</button>
            </form>
        </section>
    </main>
</body>
</html>
